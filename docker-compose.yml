services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    # Lê GROQ_KEY do .env da raiz; sem o arquivo, a API roda em modo demonstração.
    env_file:
      - path: .env
        required: false
    command:
      [
        "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
        "--reload", "--reload-include", "*.json", "--reload-include", "*.csv",
      ]
    volumes:
      - ./backend/app:/srv/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      # Mantém as dependências do contêiner separadas das do host.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
