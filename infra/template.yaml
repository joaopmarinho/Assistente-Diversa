AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Assistente Diversa - API (Lambda) e frontend (S3 + CloudFront) com desligamento automático por custo.

Parameters:
  GroqKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Chave da Groq. Vazia = a API responde em modo demonstração.
  AlertEmail:
    Type: String
    Description: E-mail que recebe o alerta quando houver qualquer custo.
  ConcorrenciaMaxima:
    Type: Number
    Default: 3
    Description: Execuções simultâneas da API; é o teto de uso e, portanto, de custo.

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../backend
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      MemorySize: 1024
      Timeout: 40
      ReservedConcurrentExecutions: !Ref ConcorrenciaMaxima
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          GROQ_KEY: !Ref GroqKey

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # O CloudFront serve o site e encaminha /api/* para a Lambda, então o frontend usa a mesma origem (sem CORS).
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-42c6-8b21-6b6b6cc2f6f2

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic

  # Custo bruto (créditos não abatem) acima de US$ 0,10, o mínimo aceito pelo Budgets, dispara o alerta.
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 1
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: ABSOLUTE_VALUE
            Threshold: 0.1
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # Concorrência 0 bloqueia toda execução da API; um novo deploy a restaura.
  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      InlineCode: |
        import os
        import boto3

        def handler(event, context):
            boto3.client("lambda").put_function_concurrency(
                FunctionName=os.environ["ALVO"], ReservedConcurrentExecutions=0
            )
      Environment:
        Variables:
          ALVO: !Ref ApiFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource: !GetAtt ApiFunction.Arn
      Events:
        Alerta:
          Type: SNS
          Properties:
            Topic: !Ref AlertTopic

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
