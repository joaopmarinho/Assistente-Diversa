server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mesma origem do frontend, como o CloudFront faz em produção.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
